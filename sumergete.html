<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sumérgete 360° | Sarañani Tours</title>

  <!-- Fuentes / Icons / Leaflet CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root{
      --bg:#111;
      --text:#eee;
      --accent:#DC143C;
      --accent2:#00CED1;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);}
    /* Topbar + navbar (opcional) */
    .top-bar{position:fixed;top:0;left:0;width:100%;height:36px;background:#0b0b0b;display:flex;align-items:center;padding:0 12px;z-index:4000;border-bottom:1px solid rgba(255,255,255,0.03);font-size:14px}
    .navbar{position:fixed;top:36px;left:0;width:100%;height:64px;background:rgba(10,10,10,0.9);display:flex;align-items:center;padding:0 18px;z-index:3999;border-bottom:1px solid rgba(255,255,255,0.04)}
    .nav-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700}
    .nav-links{display:flex;gap:18px}
    .nav-links a{color:#ddd}
    /* contenedor del mapa (considera el topbars) */
    #map-container{position:absolute;top:100px;bottom:0;left:0;right:0}
    #map{width:100%;height:100%}

    /* overlay info */
    .map-overlay{
      position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:3500;
      background:rgba(0,0,0,0.75);padding:10px 18px;border-radius:999px;border:1px solid var(--accent2);
      color:var(--text); pointer-events:none; font-size:14px;
    }

    /* modal viewer */
    .viewer-modal{
      position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:6000;
      padding:20px;
    }
    .viewer-modal.active{display:flex}
    .viewer-wrap{width:100%;max-width:1200px;height:80vh;background:#000;border:3px solid var(--accent);border-radius:10px;overflow:hidden;position:relative}
    .viewer-iframe{width:100%;height:100%;border:0;display:block}
    .viewer-close{
      position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:#fff;color:#000;border:0;font-size:20px;cursor:pointer;z-index:10;
    }
    .viewer-title{position:absolute;left:20px;top:18px;color:#fff;z-index:10;font-weight:600}

    /* responsive */
    @media (max-width:720px){
      .map-overlay{left:12px;transform:none;top:70px}
      .navbar{padding:0 10px}
      #map-container{top:100px}
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>📞 +591 69940021 — Sarañani Tours</div>
  </div>

  <div class="navbar">
    <div class="nav-inner">
      <div class="logo">
        <img src="public/logo1.png" alt="logo" style="height:34px;object-fit:contain">
        <span>Sarañani</span>
      </div>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="circuits.html">Circuitos</a>
        <a href="sumergete.html" style="color:#fff">360°</a>
        <a href="about.html">Nosotros</a>
      </div>
    </div>
  </div>

  <div id="map-container">
    <div class="map-overlay"><i class="fas fa-hand-pointer"></i> Haz clic en un marcador para abrir el 360°</div>
    <div id="map"></div>
  </div>

  <!-- Modal 360 -->
  <div class="viewer-modal" id="modal360" aria-hidden="true">
    <div class="viewer-wrap" role="dialog" aria-modal="true">
      <button class="viewer-close" id="btnClose" title="Cerrar">&times;</button>
      <div class="viewer-title" id="modalTitle">Cargando...</div>
      <iframe id="iframe360" class="viewer-iframe" src="" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializa mapa
    const map = L.map('map', {zoomControl:true}).setView([-16.29, -63.5887], 6);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    // Marcadores y enlaces embed (Google Street View: src de iframe)
    const locations = [
      {
        name: "Cholet (El Alto)",
        lat: -16.49345258959376,
        lng: -68.18064743565333,
        embed: "https://www.google.com/maps/embed?pb=!4v1763915025531!6m8!1m7!1sCAoSFkNJSE0wb2dLRUlDQWdJREc2ck9kY1E.!2m2!1d-16.49345258959376!2d-68.18064743565333!3f182.4724851145985!4f0!5f0.7820865974627469"
      },
      {
        name: "Titicaca",
        lat: -15.99080386140975,
        lng: -69.20193806416958,
        embed: "https://www.google.com/maps/embed?pb=!4v1763915110549!6m8!1m7!1sCAoSFkNJSE0wb2dLRUlDQWdJREVxZkMyWkE.!2m2!1d-15.99080386140975!2d-69.20193806416958!3f44.94!4f0!5f0.7820865974627469"
      },
      {
        name: "Toro Toro",
        lat: -18.13377947398097,
        lng: -65.83915707698588,
        embed: "https://www.google.com/maps/embed?pb=!4v1763915149114!6m8!1m7!1sCAoSF0NJSE0wb2dLRUlDQWdJRDRwUHVEeXdF!2m2!1d-18.13377947398097!2d-65.83915707698588!3f140!4f0!5f0.7820865974627469"
      },
      {
        name: "Illimani",
        lat: -16.65458446514107,
        lng: -67.80152113238604,
        embed: "https://www.google.com/maps/embed?pb=!4v1763915195004!6m8!1m7!1sCAoSF0NJSE0wb2dLRUlDQWdJRHFpX0xCMkFF!2m2!1d-16.65458446514107!2d-67.80152113238604!3f60!4f20!5f0.7820865974627469"
      },
      {
        name: "Salar de Uyuni",
        lat: -20.31179886011706,
        lng: -66.99711397698933,
        embed: "https://www.google.com/maps/embed?pb=!4v1763915312862!6m8!1m7!1szf8yO90iymOhnZuiK6Ijyw!2m2!1d-20.31179886011706!2d-66.99711397698933!3f229.1442109716772!4f-1.2669755167484595!5f0.7820865974627469"
      }
    ];

    // Icono rojo
    const tourIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25,41],
      iconAnchor: [12,41],
      popupAnchor: [1,-34],
      shadowSize: [41,41]
    });

    // Añadir marcadores
    locations.forEach(loc => {
      const marker = L.marker([loc.lat, loc.lng], {icon: tourIcon}).addTo(map);
      marker.bindTooltip(loc.name, {direction:'top', offset:[0,-10]});
      marker.on('click', () => openViewer(loc));
    });

    // Modal + iframe
    const modal = document.getElementById('modal360');
    const iframe = document.getElementById('iframe360');
    const modalTitle = document.getElementById('modalTitle');
    const btnClose = document.getElementById('btnClose');

    function openViewer(loc){
      modalTitle.innerText = loc.name;
      // IMPORTANTE: Google embed URL funciona como src directo del iframe
      iframe.src = loc.embed;
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeViewer(){
      modal.classList.remove('active');
      iframe.src = '';
      modal.setAttribute('aria-hidden', 'true');
    }

    btnClose.addEventListener('click', closeViewer);

    // Cerrar si hacen click fuera del contenedor
    modal.addEventListener('click', (e) => {
      // si clic en modal (no en el iframe o su wrapper), cerramos
      if(e.target === modal) closeViewer();
    });

    // --- Consejos si NO aparece nada ---
    // 1) Abre la consola del navegador (F12 → Console) y pega cualquier error aquí.
    // 2) Asegúrate de tener conexión a internet (Leaflet y Google embeds se cargan desde la web).
    // 3) Si abres desde file:// y tienes problemas, prueba servir con Live Server (VSCode) o Python simple server:
    //    python -m http.server 8000  (luego abre http://localhost:8000/sumergete.html)
  </script>
</body>
</html>
